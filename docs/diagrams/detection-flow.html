<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>net-watch detection flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · net-watch</p>
    <h1>What the watcher does when a signal arrives</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="detection-flow-title detection-flow-desc">
        <title id="detection-flow-title">net-watch detection flow</title>
        <desc id="detection-flow-desc">A signal arrives. If the browser says offline, the state is Offline. If your server answered a real request, the state is Online and no probe is sent. Otherwise one probe runs: an answer means Online, no answer means Offline, which retries the probe with backoff.</desc>
        <defs>
          <pattern id="detection-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#detection-flow-dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <line x1="200" y1="150" x2="250" y2="150" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        <line x1="430" y1="150" x2="500" y2="150" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        <line x1="680" y1="150" x2="800" y2="150" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        <line x1="340" y1="210" x2="340" y2="342" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        <line x1="590" y1="210" x2="590" y2="338" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
        <line x1="680" y1="370" x2="810" y2="370" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        <line x1="900" y1="310" x2="900" y2="178" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        <path d="M900 430 V482 Q900 490 892 490 H348 Q340 490 340 482 V398" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
        <line x1="410" y1="370" x2="500" y2="370" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="448" y="130" width="24" height="14" rx="2" fill="#f5f5f5"/>
        <text x="460.0" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="728" y="130" width="32" height="14" rx="2" fill="#f5f5f5"/>
        <text x="744.0" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="352" y="270" width="32" height="14" rx="2" fill="#f5f5f5"/>
        <text x="368.0" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="604" y="270" width="76" height="14" rx="2" fill="#f5f5f5"/>
        <text x="642.0" y="280" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO RESPONSE</text>
        <rect x="916" y="240" width="32" height="14" rx="2" fill="#f5f5f5"/>
        <text x="932.0" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="916" y="456" width="24" height="14" rx="2" fill="#f5f5f5"/>
        <text x="928.0" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="432" y="348" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="460.0" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BACKOFF</text>

        <!-- Nodes -->
        <rect x="40" y="122" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="120.0" y="146" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signal arrives</text>
        <text x="120.0" y="163" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">event, fetch, focus</text>
        <polygon points="250,150 340,90 430,150 340,210" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="340" y="146" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser says</text>
        <text x="340" y="163" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">offline?</text>
        <polygon points="500,150 590,90 680,150 590,210" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="590" y="146" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Response from</text>
        <text x="590" y="163" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">your server?</text>
        <rect x="800" y="122" width="200" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="900.0" y="146" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Online</text>
        <text x="900.0" y="163" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">no probe sent</text>
        <rect x="500" y="338" width="180" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="590" y="366" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Probe</text>
        <text x="590" y="384" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">HEAD pingUrl</text>
        <polygon points="810,370 900,310 990,370 900,430" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="900" y="366" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Probe</text>
        <text x="900" y="383" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">answered?</text>
        <rect x="270" y="342" width="140" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="340.0" y="366" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Offline</text>
        <text x="340.0" y="383" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">retry 2 s to 30 s</text>

        <!-- Legend -->
        <line x1="40" y1="530" x2="1000" y2="530" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <rect x="40" y="566" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="576" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Start or state (oval)</text>
        <polygon points="232,572 244,566 256,572 244,578" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="264" y="576" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Decision (diamond)</text>
        <rect x="420" y="566" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="452" y="576" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">The only request net-watch sends</text>
        <line x1="700" y1="572" x2="728" y2="572" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="736" y="576" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Retry while offline</text>
      </svg>
    </div>
  </div>
</body>
</html>
