<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>net-watch architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · net-watch</p>
    <h1>Signals in, one state out</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">net-watch architecture: signals in, one state out</title>
        <desc id="architecture-desc">Browser signals, app requests and native or service-worker sources feed the watcher, which uses the probe and metrics modules inside the zero-dependency detection engine; the banner and framework adapters read the state only through subscribe.</desc>
        <defs>
          <pattern id="architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#architecture-dots)" opacity="0.55"/>

        <!-- ============ Zone: detection engine ============ -->
        <rect x="320" y="200" width="600" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="712" y="204" width="200" height="12" rx="2" fill="#f5f5f5"/>
        <text x="908" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">DETECTION ENGINE · ZERO DEPS</text>

        <!-- ============ Arrows (behind nodes) ============ -->
        <!-- Browser signals → watcher -->
        <path d="M260,152 H372 Q380,152 380,160 V268 Q380,276 388,276 H500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- App requests → watcher -->
        <line x1="260" y1="296" x2="500" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Native & SW → watcher (optional source, dashed) -->
        <path d="M260,440 H372 Q380,440 380,432 V324 Q380,316 388,316 H500" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- watcher → probe / quality -->
        <line x1="560" y1="336" x2="560" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="700" y1="336" x2="700" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- probe → ping endpoint (HTTP) -->
        <line x1="530" y1="496" x2="530" y2="568" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- watcher → banner / adapters -->
        <path d="M740,280 H952 Q960,280 960,272 V208 Q960,200 968,200 H1000" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M740,312 H952 Q960,312 960,320 V384 Q960,392 968,392 H1000" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ Arrow labels ============ -->
        <rect x="276" y="132" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="296" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENTS</text>

        <rect x="264" y="276" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="290" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPORT()</text>

        <rect x="264" y="420" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="290" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPORT()</text>

        <rect x="568" y="378" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="586" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROBE</text>

        <rect x="708" y="378" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="732" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAMPLES</text>

        <rect x="538" y="546" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="568" y="555" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS HEAD</text>

        <rect x="760" y="260" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="788" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBSCRIBE</text>

        <rect x="760" y="292" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="788" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBSCRIBE</text>

        <!-- ============ Nodes ============ -->
        <!-- Sources -->
        <rect x="40" y="120" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="120" width="220" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="150" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser signals</text>
        <text x="150" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">online · offline · visibilitychange</text>
        <text x="150" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pageshow · connection · timing</text>

        <rect x="40" y="264" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="264" width="220" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="150" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App requests</text>
        <text x="150" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">watchFetch() · core/fetch</text>
        <text x="150" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">report(ok, rtt)</text>

        <rect x="40" y="408" width="220" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="408" width="220" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="150" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Native &amp; service worker</text>
        <text x="150" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Capacitor · Electron · SW</text>
        <text x="150" y="458" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">report(ok)</text>

        <!-- Engine -->
        <rect x="500" y="256" width="240" height="80" rx="6" fill="#ffffff"/>
        <rect x="500" y="256" width="240" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="620" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Watcher</text>
        <text x="620" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/watcher.ts</text>
        <text x="620" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state · set() · notify · scheduler</text>

        <rect x="420" y="432" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="530" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Probe</text>
        <text x="530" y="470" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/probe.ts</text>
        <text x="530" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">returns RTT or null</text>

        <rect x="664" y="432" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="774" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Metrics</text>
        <text x="774" y="470" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/metrics.ts</text>
        <text x="774" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rtt · downlink · quality bands</text>

        <!-- External: ping endpoint -->
        <rect x="420" y="568" width="220" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="568" width="220" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="530" y="588" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ping endpoint</text>
        <text x="530" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/ping · 204 · no-store</text>

        <!-- Consumers -->
        <rect x="1000" y="168" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1120" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Banner</text>
        <text x="1120" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/banner · DOM</text>
        <text x="1120" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">offline · slow · back online</text>

        <rect x="1000" y="360" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1120" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Framework adapters</text>
        <text x="1120" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">react · vue · angular · …</text>
        <text x="1120" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">getState() + subscribe() only</text>

        <!-- ============ Legend ============ -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="684" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="72" y="694" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: owns the state</text>

        <rect x="216" y="684" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="248" y="694" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Module</text>

        <rect x="328" y="684" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="360" y="694" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External (browser, server)</text>

        <rect x="532" y="684" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="564" y="694" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">App input</text>

        <rect x="660" y="684" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="692" y="694" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Optional source</text>

        <line x1="808" y1="690" x2="836" y2="690" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="844" y="694" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">In-process call</text>

        <line x1="960" y1="690" x2="988" y2="690" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="996" y="694" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Network request</text>
      </svg>
    </div>
  </div>
</body>
</html>
