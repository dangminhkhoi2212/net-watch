<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-machine-title state-machine-desc" id="state-machine-root">
        <title id="state-machine-title">net-watch connectivity states and quality bands</title>
        <desc id="state-machine-desc">Connectivity moves between Online, Checking and Offline: suspicion triggers one probe, probe failure leads to Offline with backoff retries, and real evidence returns to Online; quality is one of four bands over smoothed round-trip time, degrading at each bound and improving only below 0.8 times the bound.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #state-machine-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #state-machine-root { font-family: var(--font-sans); color: var(--color-ink); }
      #state-machine-root .diagram-container { width: 100%; overflow-x: auto; }
      #state-machine-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="state-machine-state-machine-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="state-machine-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#state-machine-state-machine-dots)" opacity="0.55"/>

        <!-- ============ Zones ============ -->
        <rect x="40" y="80" width="1200" height="320" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="48" y="84" width="236" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="93" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CONNECTIVITY · STATE.ONLINE</text>

        <rect x="40" y="416" width="1200" height="192" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="48" y="420" width="300" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">QUALITY · SMOOTHED RTT · WHILE ONLINE</text>

        <!-- ============ Transitions: connectivity ============ -->
        <line x1="640" y1="334" x2="640" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>
        <line x1="320" y1="232" x2="540" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>
        <line x1="540" y1="264" x2="320" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>
        <line x1="740" y1="232" x2="960" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>
        <line x1="960" y1="264" x2="740" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>
        <path d="M200,200 V144 Q200,136 208,136 H1092 Q1100,136 1100,144 V200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>
        <path d="M1100,296 V360 Q1100,368 1092,368 H208 Q200,368 200,360 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>

        <!-- ============ Quality direction arrows ============ -->
        <line x1="140" y1="448" x2="1140" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>
        <line x1="1140" y1="552" x2="140" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>

        <!-- ============ Transition labels ============ -->
        <rect x="648" y="308" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="664" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START</text>

        <rect x="406" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUSPECT</text>

        <rect x="404" y="244" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROBE OK</text>

        <rect x="820" y="212" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="850" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROBE FAIL</text>

        <rect x="812" y="244" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="850" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BACKOFF TIMER</text>

        <rect x="600" y="116" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OFFLINE EVENT</text>

        <rect x="384" y="348" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPORT(TRUE)</text>

        <rect x="616" y="428" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="437" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEGRADE</text>

        <rect x="616" y="560" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="569" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IMPROVE</text>

        <!-- ============ Start dot ============ -->
        <circle cx="640" cy="340" r="6" fill="#2d3142"/>

        <!-- ============ States: connectivity ============ -->
        <rect x="120" y="200" width="200" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="208" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="148" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="220" y="244" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Online</text>
        <text x="220" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">online: true</text>
        <text x="220" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">idle = zero requests</text>

        <rect x="540" y="200" width="200" height="96" rx="8" fill="#ffffff"/>
        <rect x="540" y="200" width="200" height="96" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="548" y="208" width="40" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="568" y="217" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="640" y="244" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checking</text>
        <text x="640" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one probe in flight</text>
        <text x="640" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state.online unchanged</text>

        <rect x="960" y="200" width="200" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="968" y="208" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="988" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="1060" y="244" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Offline</text>
        <text x="1060" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">online: false</text>
        <text x="1060" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retry 2s · 4s · 8s … 30s</text>

        <!-- ============ Quality bands ============ -->
        <rect x="120" y="464" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="248" y="494" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Excellent</text>
        <text x="248" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt; 150 ms</text>

        <rect x="380" y="464" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="508" y="494" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Good</text>
        <text x="508" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">150 – 400 ms</text>

        <rect x="640" y="464" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="768" y="494" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fair</text>
        <text x="768" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">400 – 1400 ms</text>

        <rect x="900" y="464" width="256" height="64" rx="6" fill="#ffffff"/>
        <rect x="900" y="464" width="256" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="1028" y="494" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Poor</text>
        <text x="1028" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&gt;= 1400 ms · slowText</text>

        <!-- ============ Annotation ============ -->
        <text x="700" y="324" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Suspect = report(false), online event, tab visible, pageshow.</text>
        <text x="700" y="344" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">No pingUrl: Checking resolves to navigator.onLine at once.</text>
        <text x="140" y="596" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Unknown until the first sample and after going offline. Degrade at a bound; improve only below 0.8 × the bound.</text>

        <!-- ============ Legend ============ -->
        <line x1="40" y1="632" x2="1240" y2="632" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="46" cy="674" r="5" fill="#2d3142"/>
        <text x="60" y="678" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start</text>

        <rect x="120" y="668" width="24" height="12" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="152" y="678" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State or band</text>

        <rect x="248" y="668" width="24" height="12" rx="4" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="280" y="678" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: Checking sends the probe; Poor shows the slow banner</text>

        <line x1="600" y1="674" x2="628" y2="674" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-machine-arrow)"/>
        <text x="636" y="678" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition, labelled with its trigger (default rttBounds 150 / 400 / 1400 ms)</text>
      </svg>
